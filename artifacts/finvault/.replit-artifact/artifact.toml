kind = "web"
previewPath = "/"
title = "FinVault – Financial Services"
version = "1.0.0"
id = "artifacts/finvault"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21054

[services.development]
run = "pnpm --filter @workspace/finvault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/finvault", "run", "build" ]
serve = "static"
publicDir = "artifacts/finvault/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21054"
BASE_PATH = "/"
